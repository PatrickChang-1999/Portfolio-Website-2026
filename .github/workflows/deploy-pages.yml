name: Deploy portfolio to GitHub Pages

on:
  # Publishing is started manually in GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Check required files and JavaScript
        run: |
          test -f dist/index.html
          test -f "dist/Ting-Yu Chang Resume for github.pdf"
          for script in dist/*.js; do
            node --check "$script"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
